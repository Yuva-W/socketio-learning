<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.io</title>
    <link rel="stylesheet" href="index.css">

    <!-- bootstrap CSS CDN link  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-body-secondary">
    <div class="container p-5 m-5">
        <h1 class="text-center">chats</h1>
        <hr>
        <div class="row shadow p-3 mb-5 bg-body-tertiary rounded" id="msg-area">
            <!-- main chart container -->
            <div class="col-8 main">
                <div class="input-group mb-3">
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        placeholder="Enter your name"
                    >
                    <button class="btn btn-success" id="join">Join</button>
                </div>
                
                <ul id="message"></ul>
            </div>
        </div>

        <!-- message text area  -->
        <div class="row shadow p-3 mb-5 bg-body-tertiary rounded text-center" id="text-area">
            <div class="input-group mb-3">
                <div class="col-1 ps-5"></div>
                <div class="col-9 d-flex">
                    <input type="text" class="form-control ms-5" aria-label="Sizing example input" placeholder="Enter Message......"
                aria-describedby="inputGroup-sizing-default" id="input">
                <button class="btn btn-primary ms-5" id="send">Send.</button>
                </div>

                <div class="col-1"></div>

            </div>
        </div>

        <footer class="text-center">2026 @ all-Rights are reserved</footer>
    </div>

    <!-- bootstrap JS CDN link  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- connect to socket.io  -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- clint side  -->
    <script src="index.js"></script>
</body>

</html>
